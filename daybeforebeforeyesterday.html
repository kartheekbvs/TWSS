<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWSS - Protected Content</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    #auth-container, #image-container {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 90%;
      margin: 1rem;
    }
    #auth-container h2 { margin-bottom: 1.5rem; }
    #auth-form input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #auth-form button {
      width: 100%;
      padding: 0.9rem;
      background: #f7a800;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .auth-status { margin-top: 1rem; font-weight: bold; }
    .auth-status.error { color: red; }
    .auth-status.success { color: green; }
    #logout-btn {
      margin-top: 1rem;
      padding: 0.7rem 1.2rem;
      background: #dc3545;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }
    .download-btn {
      display: inline-block;
      background: #17a2b8;
      color: #fff;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      margin-top: 1rem;
      text-decoration: none;
      font-weight: bold;
    }
    .download-btn:hover { background: #117a8b; }
  </style>
</head>
<body>
  <div id="auth-container">
    <div id="auth-form">
      <h2>Login</h2>
      <input type="email" id="user-email" placeholder="Email" required>
      <input type="password" id="user-password" placeholder="Password" required>
      <button id="login-button" onclick="login()">Login</button>
      <div class="auth-status" id="auth-status"></div>
    </div>
  </div>

  <div id="image-container" style="display:none;">
    <h2>Protected Content</h2>
    <img id="protected-image" src="/Screenshot 2025-08-27 005537.png" alt="Protected" />
    <!-- ✅ Download button -->
    <a href="/downloads/yesterday.pdf" class="download-btn" download>Download Now</a>
  </div>

  <button id="logout-btn" onclick="logout()">Logout</button>

  <script>
    // Supabase Init
    const { createClient } = supabase;
    const supabaseClient = createClient(
      "https://fzwvxesrtdilljgrntpw.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6d3Z4ZXNydGRpbGxqZ3JudHB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA4NzU2NzMsImV4cCI6MjA2NjQ1MTY3M30.YnxjUtFawuumihyVGuk8e-o6iE9OkDf-MX1aKRTqA5U"
    );

    const authContainer = document.getElementById("auth-container");
    const imageContainer = document.getElementById("image-container");
    const authStatusDiv = document.getElementById("auth-status");
    const logoutBtn = document.getElementById("logout-btn");

    const USERS_TABLE = "users_login";
    const ACCESS_TABLE = "paid_access";

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const uid = params.get("uid");
      const pass = params.get("pass");

      if (uid && pass) {
        document.getElementById("user-email").value = uid;
        document.getElementById("user-password").value = pass;
        await login(true);
      } else {
        showStatus("❌ Direct access not allowed", "error");
      }
    });

    async function login(auto=false) {
      const email = document.getElementById("user-email").value;
      const password = document.getElementById("user-password").value;

      try {
        // 1. Check if access exists & not used
        const { data, error } = await supabaseClient
          .from(ACCESS_TABLE)
          .select("uid, password, used")
          .eq("uid", email)
          .eq("password", password);

        if (error || data.length === 0) {
          showStatus("❌ Invalid or expired link", "error");
          return;
        }

        if (data[0].used === true) {
          showStatus("❌ This link has already been used", "error");
          return;
        }

        // 2. Mark as used
        await supabaseClient
          .from(ACCESS_TABLE)
          .update({ used: true })
          .eq("uid", email)
          .eq("password", password);

        // 3. Insert user if not in users_login
        await supabaseClient.from(USERS_TABLE).upsert([{ email, password }]);

        // 4. Grant access
        localStorage.setItem("userEmail", email);
        showStatus("✅ Access granted!", "success");
        setTimeout(showImageUI, 1000);

      } catch (err) {
        console.error(err);
        showStatus("❌ Unexpected error", "error");
      }
    }

    function logout() {
      localStorage.removeItem("userEmail");
      authContainer.style.display = "block";
      imageContainer.style.display = "none";
      logoutBtn.style.display = "none";
    }

    function showImageUI() {
      authContainer.style.display = "none";
      imageContainer.style.display = "block";
      logoutBtn.style.display = "block";
    }

    function showStatus(message, type) {
      authStatusDiv.textContent = message;
      authStatusDiv.className = `auth-status ${type}`;
    }
  </script>
     <script>
        // Remove alert calls for better user experience
        document.onkeydown = function(e) {
            if (
                e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S') ||
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i'))
            ) {
                // console.log("Developer tools or source view attempt detected.");
                return false; // Prevent default action for these keys
            }
        };
        
        document.addEventListener('contextmenu', event => {
            event.preventDefault(); // Prevent right-click context menu
        });
            </script>
</body>
</html>
