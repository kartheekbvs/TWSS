<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            color: #333;
            text-align: center;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007bff;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1em;
        }
        #countdown {
            font-weight: bold;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You are being redirected...</h1>
        <p>This page will redirect in <span id="countdown"></span> minutes.</p>
    </div>

    <script>
        const redirectURL = "https://twss-awe.pages.dev"; // Replace with your desired URL
        const redirectMinutes = 1; // Set the number of minutes before redirection

        const countdownElement = document.getElementById("countdown");
        let remainingSeconds = redirectMinutes * 60;

        function updateCountdown() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            countdownElement.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            if (remainingSeconds <= 0) {
                window.location.href = redirectURL;
            } else {
                remainingSeconds--;
                setTimeout(updateCountdown, 10); // Update every second
            }
        }

        updateCountdown(); // Initial call to start the countdown
    </script>
</body>
</html>
