<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maximum Subarray Solver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin-top: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: inline-block;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #b0b0b0;
            letter-spacing: 1px;
        }

        .input-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #e0e0e0;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1rem;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .secondary-btn {
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .result-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1s ease;
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .result-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ffffff;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        .result-item {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border-left: 4px solid #ffffff;
        }

        .result-label {
            font-weight: 600;
            color: #b0b0b0;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.2rem;
            color: #ffffff;
        }

        .array-visualization {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .array-element {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .array-element.max {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #ffffff;
            transform: scale(1.1);
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 8px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            padding: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                padding: 15px 25px;
            }
            
            .input-section, .result-section {
                padding: 25px;
            }
            
            button {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Maximum Subarray Solver</h1>
            <p class="subtitle">Made by 23BCS12865, 24bcs80009, and 23bcs13825</p>
        </header>

        <main>
            <section class="input-section">
                <div class="input-group">
                    <label for="arrayInput">Enter Array Elements (comma-separated):</label>
                    <input type="text" id="arrayInput" placeholder="e.g., -2, 1, -3, 4, -1, 2, 1, -5, 4">
                    <div class="error-message" id="errorMessage"></div>
                </div>
                <div class="button-group">
                    <button onclick="solveMaximumSubarray()">Solve</button>
                    <button class="secondary-btn" onclick="clearAll()">Clear</button>
                </div>
            </section>

            <section class="result-section" id="resultSection">
                <h2 class="result-title">Solution Results</h2>
                
                <div class="result-item">
                    <div class="result-label">Maximum Subarray:</div>
                    <div class="result-value" id="maxSubarray"></div>
                </div>
                
                <div class="result-item">
                    <div class="result-label">Maximum Sum:</div>
                    <div class="result-value" id="maxSum"></div>
                </div>
                
                <div class="result-item">
                    <div class="result-label">Start Index:</div>
                    <div class="result-value" id="startIndex"></div>
                </div>
                
                <div class="result-item">
                    <div class="result-label">End Index:</div>
                    <div class="result-value" id="endIndex"></div>
                </div>
                
                <div class="result-item">
                    <div class="result-label">Array Visualization:</div>
                    <div class="array-visualization" id="arrayVisualization"></div>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2024 Maximum Subarray Solver | Efficient O(n) Algorithm Implementation</p>
        </footer>
    </div>

    <script>
        function solveMaximumSubarray() {
            const input = document.getElementById('arrayInput').value;
            const errorMessage = document.getElementById('errorMessage');
            const resultSection = document.getElementById('resultSection');
            
            // Reset error message
            errorMessage.classList.remove('active');
            errorMessage.textContent = '';
            
            // Parse input
            const array = input.split(',').map(item => {
                const num = parseFloat(item.trim());
                if (isNaN(num)) {
                    throw new Error(`Invalid number: ${item.trim()}`);
                }
                return num;
            });
            
            try {
                if (array.length === 0) {
                    throw new Error('Please enter at least one number');
                }
                
                // Kadane's Algorithm
                let maxSum = array[0];
                let currentSum = array[0];
                let start = 0;
                let end = 0;
                let tempStart = 0;
                
                for (let i = 1; i < array.length; i++) {
                    if (currentSum + array[i] < array[i]) {
                        currentSum = array[i];
                        tempStart = i;
                    } else {
                        currentSum += array[i];
                    }
                    
                    if (currentSum > maxSum) {
                        maxSum = currentSum;
                        start = tempStart;
                        end = i;
                    }
                }
                
                // Get the maximum subarray
                const maxSubarray = array.slice(start, end + 1);
                
                // Display results
                document.getElementById('maxSubarray').textContent = `[${maxSubarray.join(', ')}]`;
                document.getElementById('maxSum').textContent = maxSum;
                document.getElementById('startIndex').textContent = start;
                document.getElementById('endIndex').textContent = end;
                
                // Visualize array
                visualizeArray(array, start, end);
                
                // Show result section
                resultSection.classList.add('active');
                
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.add('active');
                resultSection.classList.remove('active');
            }
        }
        
        function visualizeArray(array, start, end) {
            const visualization = document.getElementById('arrayVisualization');
            visualization.innerHTML = '';
            
            array.forEach((element, index) => {
                const elementDiv = document.createElement('div');
                elementDiv.className = 'array-element';
                elementDiv.textContent = element;
                
                if (index >= start && index <= end) {
                    elementDiv.classList.add('max');
                }
                
                visualization.appendChild(elementDiv);
            });
        }
        
        function clearAll() {
            document.getElementById('arrayInput').value = '';
            document.getElementById('resultSection').classList.remove('active');
            document.getElementById('errorMessage').classList.remove('active');
            document.getElementById('errorMessage').textContent = '';
        }
        
        // Allow Enter key to trigger solve
        document.getElementById('arrayInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                solveMaximumSubarray();
            }
        });
    </script>
</body>
</html>
