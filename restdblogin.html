<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px #aaa;
    }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      margin: 10px 0;
      border-radius: 4px;
    }
    button:hover {
      background-color: #218838;
    }
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    .message {
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      font-weight: bold;
      display: none; /* Hidden by default */
    }
    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    .message.loading {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login or Register</h2>

    <div id="message" class="message"></div>

    <h3>Login</h3>
    <input type="email" id="loginEmail" placeholder="Email" required />
    <input type="password" id="loginPassword" placeholder="Password" required />
    <button id="loginBtn">Login</button>

    <h3>Register</h3>
    <input type="text" id="registerName" placeholder="Name" required />
    <input type="email" id="registerEmail" placeholder="Email" required />
    <input type="password" id="registerPassword" placeholder="Password" required />
    <button id="registerBtn">Register</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
  <script>
    let db;
    let restdbScriptRetryCount = 0;
    const MAX_RESTDB_SCRIPT_RETRIES = 3;
    const RETRY_DELAY_MS = 2000; // 2 seconds

    function showMessage(message, type) {
      const messageDiv = document.getElementById("message");
      messageDiv.textContent = message;
      messageDiv.className = "message " + type;
    }

    function loadRestDBScript() {
      const scriptId = 'restdb-jsapi-script';
      let existingScript = document.getElementById(scriptId);

      // Remove existing script if it's there to ensure a fresh load attempt
      if (existingScript) {
        existingScript.remove();
      }

      var script = document.createElement('script');
      script.id = scriptId;
      script.src = "https://restdb.io/rest/_jsapi.js";
      script.onload = function() {
        console.log("RestDB script loaded successfully.");
        showMessage("RestDB script loaded successfully.", "success");
        // Initialize RestDB here after successful load
        try {
          db = new restdb({
            dataurl: "https://restdb-b7b5.restdb.io/rest",
            apikey: "YOUR_API_KEY_HERE" // Replace with your actual API key
          });
          showMessage("Ready to use RestDB.", "success");
        } catch (e) {
          showMessage("Error initializing RestDB: " + e.message, "error");
          console.error("Error initializing RestDB:", e);
        }
      };
      script.onerror = function() {
        restdbScriptRetryCount++;
        console.warn(`Failed to load RestDB script. Attempt ${restdbScriptRetryCount} of ${MAX_RESTDB_SCRIPT_RETRIES}`);
        if (restdbScriptRetryCount < MAX_RESTDB_SCRIPT_RETRIES) {
          showMessage(`Retrying to load RestDB script (${restdbScriptRetryCount}/${MAX_RESTDB_SCRIPT_RETRIES})...`, "loading");
          setTimeout(loadRestDBScript, RETRY_DELAY_MS);
        } else {
          showMessage("Critical Error: RestDB script could not be loaded after multiple attempts. Please check your internet connection, browser settings (ad blockers/CSP), or try again later.", "error");
          console.error("Final attempt to load RestDB script failed.");
        }
      };
      document.head.appendChild(script);
    }

    $(document).ready(function() {
      loadRestDBScript(); // Initiate loading of RestDB script

      // Event listener for Register button
      document.getElementById("registerBtn").onclick = function() {
        if (!db) {
          showMessage("RestDB not initialized. Please wait or refresh.", "error");
          return;
        }

        var name = document.getElementById("registerName").value.trim();
        var email = document.getElementById("registerEmail").value.trim();
        var password = document.getElementById("registerPassword").value.trim();

        if (!name || !email || !password) {
          showMessage("Please fill in all registration fields", "error");
          return;
        }

        const hashedPassword = sha256(password);

        document.getElementById("registerBtn").disabled = true;
        showMessage("Registering...", "loading");

        db.userlogin.query({ email: email }, function(err, users) {
          if (err) {
            document.getElementById("registerBtn").disabled = false;
            showMessage("Registration failed: " + err.message, "error");
            return;
          }

          if (users.length > 0) {
            document.getElementById("registerBtn").disabled = false;
            showMessage("Email already registered. Please login or use a different email.", "error");
          } else {
            // No existing user with this email, proceed with registration
            var userData = {
              name: name,
              email: email,
              password: hashedPassword
            };

            db.userlogin.insert(userData, function(err, res) {
              document.getElementById("registerBtn").disabled = false;
              if (err) {
                showMessage("Registration failed: " + err.message, "error");
                return;
              }
              showMessage("Registration successful! You can now log in.", "success");
              document.getElementById("registerName").value = "";
              document.getElementById("registerEmail").value = "";
              document.getElementById("registerPassword").value = "";
            });
          }
        });
      };

      // Event listener for Login button
      document.getElementById("loginBtn").onclick = function() {
        if (!db) {
          showMessage("RestDB not initialized. Please wait or refresh.", "error");
          return;
        }

        var email = document.getElementById("loginEmail").value.trim();
        var password = document.getElementById("loginPassword").value.trim();

        if (!email || !password) {
          showMessage("Please enter both email and password", "error");
          return;
        }

        const enteredHashedPassword = sha256(password);

        document.getElementById("loginBtn").disabled = true;
        showMessage("Logging in...", "loading");

        db.userlogin.query({ email: email }, function(err, users) {
          document.getElementById("loginBtn").disabled = false;

          if (err) {
            showMessage("Login failed: " + err.message, "error");
            return;
          }

          if (users.length > 0) {
            const storedUser = users[0];
            if (storedUser.password === enteredHashedPassword) {
              showMessage("Login successful! Welcome back!", "success");
              document.getElementById("loginEmail").value = "";
              document.getElementById("loginPassword").value = "";
            } else {
              showMessage("Invalid email or password", "error");
            }
          } else {
            showMessage("Invalid email or password", "error");
          }
        });
      }; // End login function

    }); // End $(document).ready()
  </script>
</body>
</html>
