<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px #aaa;
    }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      margin: 10px 0;
      border-radius: 4px;
    }
    button:hover {
      background-color: #218838;
    }
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    #message {
      text-align: center;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .success {
      color: #28a745;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
    }
    .error {
      color: #dc3545;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
    }
    .divider {
      margin: 30px 0;
      border-top: 1px solid #eee;
    }
    .loading {
      color: #007bff;
      background-color: #d1ecf1;
      border: 1px solid #bee5eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <input type="email" id="regEmail" placeholder="Email" />
    <input type="password" id="regPassword" placeholder="Password" />
    <button id="regBtn" onclick="register()">Register</button>

    <div class="divider"></div>

    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <button id="loginBtn" onclick="login()">Login</button>

    <p id="message"></p>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://login-c7e9.restdb.io/rest/_jsapi.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>

  <script>
    // Declare db globally but initialize inside $(document).ready()
    var db; 

    // Helper function to show messages
    function showMessage(message, type) {
      var messageElement = document.getElementById("message");
      messageElement.textContent = message;
      messageElement.className = type;

      if (type === "success") {
        setTimeout(function() {
          messageElement.textContent = "";
          messageElement.className = "";
        }, 3000);
      }
    }

    // Wrap your main logic in $(document).ready() to ensure all scripts are loaded
    $(document).ready(function() {
      // Initialize RestDB here, after jQuery and _jsapi.js are definitely loaded
      db = new restdb("f00021602db841fc5a3cd70002d19f4be20d3"); // Your provided API key

      // --- Registration Function ---
      window.register = function() { // Make it global for onclick
        var email = document.getElementById("regEmail").value.trim();
        var password = document.getElementById("regPassword").value.trim();

        if (!email || !password) {
          showMessage("Please enter both email and password", "error");
          return;
        }

        var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showMessage("Please enter a valid email address", "error");
          return;
        }

        const hashedPassword = sha256(password);

        document.getElementById("regBtn").disabled = true;
        showMessage("Registering user...", "loading");

        db.userlogin.query({ email: email }, function(err, users) {
          if (err) {
            document.getElementById("regBtn").disabled = false;
            showMessage("Error checking existing user: " + err.message, "error");
            return;
          }

          if (users.length > 0) {
            document.getElementById("regBtn").disabled = false;
            showMessage("User with this email already exists", "error");
            return;
          }

          db.userlogin.insert({ email: email, password: hashedPassword }, function(err, result) {
            document.getElementById("regBtn").disabled = false;

            if (err) {
              showMessage("Registration failed: " + err.message, "error");
            } else {
              showMessage("User registered successfully!", "success");
              document.getElementById("regEmail").value = "";
              document.getElementById("regPassword").value = "";
            }
          });
        });
      }; // End register function

      // --- Login Function ---
      window.login = function() { // Make it global for onclick
        var email = document.getElementById("loginEmail").value.trim();
        var password = document.getElementById("loginPassword").value.trim();

        if (!email || !password) {
          showMessage("Please enter both email and password", "error");
          return;
        }

        const enteredHashedPassword = sha256(password);

        document.getElementById("loginBtn").disabled = true;
        showMessage("Logging in...", "loading");

        db.userlogin.query({ email: email }, function(err, users) {
          document.getElementById("loginBtn").disabled = false;

          if (err) {
            showMessage("Login failed: " + err.message, "error");
            return;
          }

          if (users.length > 0) {
            const storedUser = users[0];
            if (storedUser.password === enteredHashedPassword) {
              showMessage("Login successful! Welcome back!", "success");
              document.getElementById("loginEmail").value = "";
              document.getElementById("loginPassword").value = "";
            } else {
              showMessage("Invalid email or password", "error");
            }
          } else {
            showMessage("Invalid email or password", "error");
          }
        });
      }; // End login function

    }); // End $(document).ready()
  </script>
</body>
</html>
