<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Register</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
    .container { max-width: 400px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px #aaa; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; margin: 10px 0; }
    button:hover { background-color: #218838; }
    h2 { text-align: center; }
    #message { text-align: center; padding: 10px; margin: 10px 0; }
    .success { color: #28a745; background-color: #d4edda; border: 1px solid #c3e6cb; }
    .error { color: #dc3545; background-color: #f8d7da; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <input type="text" id="regGmail" placeholder="Gmail" />
    <input type="password" id="regPassword" placeholder="Password" />
    <button onclick="register()">Register</button>
    
    <h2>Login</h2>
    <input type="text" id="loginGmail" placeholder="Gmail" />
    <input type="password" id="loginPassword" placeholder="Password" />
    <button onclick="login()">Login</button>
    
    <p id="message"></p>
  </div>

  <script>
    const API_KEY = "686f84f91d806733d4a19284";  // use your correct API key
    const BASE_URL = "https://login-c7e9.restdb.io/rest/users";

    // Register user
    async function register() {
      const gmail = document.getElementById("regGmail").value;
      const password = document.getElementById("regPassword").value;

      if (!gmail || !password) {
        showMessage("Please enter both Gmail and password", "error");
        return;
      }

      try {
        const res = await fetch(BASE_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-apikey": API_KEY,
          },
          body: JSON.stringify({ gmail, password })
        });

        if (res.ok) {
          showMessage("User registered successfully!", "success");
          document.getElementById("regGmail").value = "";
          document.getElementById("regPassword").value = "";
        } else {
          const error = await res.json();
          showMessage("Registration failed: " + (error.message || "Unknown error"), "error");
        }
      } catch (error) {
        showMessage("Network error: " + error.message, "error");
      }
    }

    // Login user
    async function login() {
      const gmail = document.getElementById("loginGmail").value;
      const password = document.getElementById("loginPassword").value;

      if (!gmail || !password) {
        showMessage("Please enter both Gmail and password", "error");
        return;
      }

      try {
        // Search for user matching gmail and password
        const res = await fetch(`${BASE_URL}?q={"gmail":"${gmail}","password":"${password}"}`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            "x-apikey": API_KEY,
          }
        });
        const users = await res.json();

        if (users.length > 0) {
          showMessage("Login successful!", "success");
          document.getElementById("loginGmail").value = "";
          document.getElementById("loginPassword").value = "";
        } else {
          showMessage("Invalid Gmail or password", "error");
        }
      } catch (error) {
        showMessage("Network error: " + error.message, "error");
      }
    }

    // Show message
    function showMessage(message, type) {
      const messageElement = document.getElementById("message");
      messageElement.textContent = message;
      messageElement.className = type;
    }
  </script>
</body>
</html>
