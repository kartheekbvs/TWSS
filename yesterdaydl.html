<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TWSS — Duty Leave Download</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    #card{background:#fff;padding:2rem;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,0.08);max-width:520px;width:92%;text-align:center}
    #status{font-weight:600;margin-bottom:1rem}
    .error{color:#c82333}
    .success{color:#155724}
    .download-btn{display:inline-block;background:#17a2b8;color:#fff;padding:.8rem 1.3rem;border-radius:8px;text-decoration:none;margin-top:1rem}
  </style>
</head>
<body>
  <div id="card">
    <div id="status">Checking your duty leave link...</div>

    <div id="content" style="display:none">
      <h2>✅ Your Duty Leave</h2>
      <p>You can download your approved duty leave form below.<br>
         This link will expire immediately after download.<br>
         If you need another, please <a href="https://twss-awe.pages.dev/courses#downloads">buy again</a>.
      </p>
      <a id="downloadLink" class="download-btn" href="/Screenshot 2025-08-27 005537.png" download>Download Duty Leave</a>
    </div>
  </div>


<script>
(async function(){
  const SUPABASE_URL = "https://fzwvxesrtdilljgrntpw.supabase.co"; 
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6d3Z4ZXNydGRpbGxqZ3JudHB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA4NzU2NzMsImV4cCI6MjA2NjQ1MTY3M30.YnxjUtFawuumihyVGuk8e-o6iE9OkDf-MX1aKRTqA5U"; 
  const ACCESS_TABLE = "paid_access"; 
  const USERS_TABLE = "users_login";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const statusDiv = document.getElementById('status');
  const contentDiv = document.getElementById('content');

  const params = new URLSearchParams(window.location.search);
  const uid = params.get('uid');
  const pass = params.get('pass');

  if (!uid || !pass) {
    statusDiv.textContent = "❌ Invalid or missing link.";
    statusDiv.className = "error";
    return; // ✅ this is legal now because inside async function
  }

  try {
    // 1. Check if token exists and not used
    const { data, error } = await supabaseClient
      .from(ACCESS_TABLE)
      .select("id, uid, password, used")
      .eq("uid", uid)
      .eq("password", pass)
      .limit(1);

    if (error) throw error;

    if (!data || data.length === 0) {
      statusDiv.textContent = "❌ This link has expired or is invalid.";
      statusDiv.className = "error";
      return;
    }

    const access = data[0];
    if (access.used) {
      statusDiv.textContent = "❌ This link has already been used.";
      statusDiv.className = "error";
      return;
    }

    // 2. Show download button
    statusDiv.textContent = "✅ Access granted — you may download your duty leave.";
    statusDiv.className = "success";
    contentDiv.style.display = "block";

    // 3. Handle download click
    const downloadBtn = document.getElementById('downloadLink');
    downloadBtn.addEventListener('click', async (e) => {
      try {
        // Mark token as used
        await supabaseClient.from(ACCESS_TABLE)
          .update({ used: true, used_at: new Date().toISOString() })
          .eq("id", access.id);

        // Delete from users_login for cleanup
        await supabaseClient.from(USERS_TABLE).delete().eq("email", uid);

        // ✅ After download, if they refresh → it shows expired
      } catch (err) {
        console.error("Delete error:", err);
      }
    });

  } catch (err) {
    console.error("Unexpected error:", err);
    statusDiv.textContent = "⚠️ Temporary system error. Please refresh.";
    statusDiv.className = "error";
  }
})();
</script>

</body>
</html>
