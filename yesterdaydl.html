<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TWSS — Yesterday Download</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    #card{background:#fff;padding:2rem;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,0.08);max-width:520px;width:92%;text-align:center}
    #status{font-weight:600;margin-bottom:1rem}
    .error{color:#c82333}
    .success{color:#155724}
    img{max-width:100%;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.12)}
    .download-btn{display:inline-block;background:#17a2b8;color:#fff;padding:.8rem 1.3rem;border-radius:8px;text-decoration:none;margin-top:1rem}
  </style>
</head>
<body>
  <div id="card">
    <div id="status">Checking link...</div>

    <div id="content" style="display:none">
      <h2>Protected Content — Yesterday</h2>
      <img id="protected-image" src="/Screenshot 2025-08-27 005537.png" alt="Protected">
      <div>
        <!-- Change this href to the actual file you want downloadable -->
        <a id="downloadLink" class="download-btn" href="/downloads/yesterday.pdf" download>Download Now</a>
      </div>
    </div>
  </div>

<script>
(async function(){
  const SUPABASE_URL = "https://fzwvxesrtdilljgrntpw.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6d3Z4ZXNydGRpbGxqZ3JudHB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA4NzU2NzMsImV4cCI6MjA2NjQ1MTY3M30.YnxjUtFawuumihyVGuk8e-o6iE9OkDf-MX1aKRTqA5U";
  const ACCESS_TABLE = "paid_access";
  const USERS_TABLE = "users_login";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const statusDiv = document.getElementById('status');
  const contentDiv = document.getElementById('content');

  const params = new URLSearchParams(window.location.search);
  const uid = params.get('uid');
  const pass = params.get('pass');

  if (!uid || !pass) {
    statusDiv.textContent = "❌ Missing uid or pass in URL.";
    statusDiv.className = "error";
    return;
  }

  try {
    // 1) find paid_access entry (limit 1)
    const { data, error } = await supabaseClient
      .from(ACCESS_TABLE)
      .select("id, uid, password, used")
      .eq("uid", uid)
      .eq("password", pass)
      .limit(1);

    if (error) {
      console.error("DB read error:", error);
      statusDiv.textContent = "❌ Error checking link. Try again later.";
      statusDiv.className = "error";
      return;
    }

    if (!data || data.length === 0) {
      statusDiv.textContent = "❌ Invalid or expired link.";
      statusDiv.className = "error";
      return;
    }

    const access = data[0];
    if (access.used) {
      statusDiv.textContent = "❌ This link has already been used.";
      statusDiv.className = "error";
      return;
    }

    // 2) mark as used (atomic-ish: update by id)
    const { error: updateErr } = await supabaseClient
      .from(ACCESS_TABLE)
      .update({ used: true, used_at: new Date().toISOString() })
      .eq("id", access.id);

    if (updateErr) {
      console.error("DB update error:", updateErr);
      statusDiv.textContent = "❌ Could not mark link as used. Try again.";
      statusDiv.className = "error";
      return;
    }

    // 3) upsert user in users_login (so you have the user record)
    const { error: upsertErr } = await supabaseClient
      .from(USERS_TABLE)
      .upsert([{ email: uid, password: pass }], { onConflict: 'email' });

    if (upsertErr) {
      console.warn("Upsert user warning:", upsertErr);
      // not fatal: continue to allow download
    }

    // 4) success — show content and remove query from URL
    statusDiv.textContent = "✅ Access granted — your download is ready!";
    statusDiv.className = "success";
    contentDiv.style.display = "block";

    // remove query params from address bar (so credentials not visible)
    try {
      const cleanUrl = window.location.origin + window.location.pathname;
      window.history.replaceState({}, document.title, cleanUrl);
    } catch (err) {
      // if replaceState fails, ignore
    }

  } catch (err) {
    console.error("Unexpected error:", err);
    statusDiv.textContent = "❌ Unexpected error. Try again later.";
    statusDiv.className = "error";
  }
})();
  // 5) When user clicks Download, delete from DB
const downloadBtn = document.getElementById('downloadLink');
downloadBtn.addEventListener('click', async (e) => {
  e.preventDefault(); // stop immediate download

  try {
    // Delete from paid_access
    await supabaseClient
      .from(ACCESS_TABLE)
      .delete()
      .eq('id', access.id);

    // Delete from users_login
    await supabaseClient
      .from(USERS_TABLE)
      .delete()
      .eq('email', uid);

    // Now trigger the real download
    window.location.href = downloadBtn.href;
  } catch (err) {
    console.error("Delete error:", err);
    alert("❌ Could not complete deletion. Try again.");
  }
});

</script>
</body>
</html>
