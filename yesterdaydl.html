<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TWSS — Yesterday Download</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f3f3f3;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    #card{background:#fff;padding:2rem;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,0.08);max-width:520px;width:92%;text-align:center}
    #status{font-weight:600;margin-bottom:1rem}
    .error{color:#c82333}
    .success{color:#155724}
    .download-btn{display:inline-block;background:#17a2b8;color:#fff;padding:.8rem 1.3rem;border-radius:8px;text-decoration:none;margin-top:1rem}
  </style>
</head>
<body>
  <div id="card">
    <div id="status">Checking link...</div>

    <div id="content" style="display:none">
      <h2>Protected Content — Yesterday</h2>
      <a id="downloadLink" class="download-btn" href="/Screenshot 2025-08-27 005537.png" download>Download Now</a>
    </div>
  </div>

<script>
(async function(){
const SUPABASE_URL = "https://fzwvxesrtdilljgrntpw.supabase.co"; const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6d3Z4ZXNydGRpbGxqZ3JudHB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA4NzU2NzMsImV4cCI6MjA2NjQ1MTY3M30.YnxjUtFawuumihyVGuk8e-o6iE9OkDf-MX1aKRTqA5U"; const ACCESS_TABLE = "paid_access"; const USERS_TABLE = "users_login";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const statusDiv = document.getElementById('status');
  const contentDiv = document.getElementById('content');

  const params = new URLSearchParams(window.location.search);
  const uid = params.get('uid');
  const pass = params.get('pass');

  if (!uid || !pass) {
    statusDiv.textContent = "❌ Missing uid or pass in URL.";
    statusDiv.className = "error";
    return;
  }

  // ✅ Directly show content
  statusDiv.textContent = "✅ Access granted — your download is ready!";
  statusDiv.className = "success";
  contentDiv.style.display = "block";

  // Cleanup on page load (so if they refresh, entry is removed)
  try {
    await supabaseClient.from(ACCESS_TABLE).delete().eq("uid", uid).eq("password", pass);
    await supabaseClient.from(USERS_TABLE).delete().eq("email", uid);
  } catch (err) {
    console.error("Auto delete error:", err);
  }

  // Also cleanup when they click download
  const downloadBtn = document.getElementById('downloadLink');
  downloadBtn.addEventListener('click', async (e) => {
    // delete again just in case
    try {
      await supabaseClient.from(ACCESS_TABLE).delete().eq("uid", uid).eq("password", pass);
      await supabaseClient.from(USERS_TABLE).delete().eq("email", uid);
    } catch (err) {
      console.error("Delete error:", err);
    }
    // let the file download
  });
})();
</script>
</body>
</html>
